name: Public homepage visual QA

on:
  push:
    branches: [design/public-homepage]
    paths:
      - 'index.html'
      - 'editorial-production*.css'
      - 'editorial-production.js'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/visual-night-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'editorial-production*.css'
      - 'editorial-production.js'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/visual-night-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Verify static implementation
        run: |
          node scripts/verify-site.mjs
          node scripts/check-web.mjs
          node --check editorial-production.js

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/deliver-server.log 2>&1 &
          echo $! > /tmp/deliver-server.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/deliver-server.log
          exit 1

      - name: Capture desktop tablet and mobile
        run: |
          mkdir -p visual/actual visual/runtime
          cat > visual/runtime/capture.mjs <<'EOF'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const views = [
            ['desktop', 1440, 900],
            ['tablet', 768, 900],
            ['mobile', 390, 844],
          ];
          const selectors = [
            '.site-header',
            '.hero',
            '.service-section',
            '.process-section',
            '.tracking-section',
            '.coverage-section',
            '.business-section',
            '.rider-section',
            '.safety-section',
            '.faq-section',
            '.final-cta',
            '.site-footer',
          ];
          const summaries = [];

          try {
            for (const [name, width, height] of views) {
              const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
              await page.emulateMedia({ reducedMotion: 'reduce' });

              const browserErrors = [];
              page.on('console', (message) => {
                if (message.type() === 'error') browserErrors.push(message.text());
              });
              page.on('pageerror', (error) => browserErrors.push(error.message));
              page.on('requestfailed', (request) => {
                browserErrors.push(`Request failed: ${request.url()} (${request.failure()?.errorText ?? 'unknown'})`);
              });

              await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle', timeout: 30000 });
              await page.waitForSelector('.site-header', { state: 'visible', timeout: 10000 });
              await page.waitForFunction(() => document.documentElement.classList.contains('js'), null, { timeout: 10000 });
              await page.evaluate(async () => {
                document.querySelectorAll('.reveal').forEach((node) => node.classList.add('is-visible'));
                await Promise.race([
                  document.fonts.ready,
                  new Promise((resolve) => setTimeout(resolve, 3000)),
                ]);
              });

              const metrics = await page.evaluate((targets) => {
                const rects = Object.fromEntries(targets.map((selector) => {
                  const node = document.querySelector(selector);
                  if (!node) return [selector, null];
                  const rect = node.getBoundingClientRect();
                  return [selector, {
                    x: Math.round(rect.x),
                    y: Math.round(rect.y + scrollY),
                    width: Math.round(rect.width),
                    height: Math.round(rect.height),
                  }];
                }));
                const documentWidth = document.documentElement.scrollWidth;
                return {
                  title: document.title,
                  theme: document.documentElement.dataset.theme,
                  viewport: { width: innerWidth, height: innerHeight },
                  document: {
                    width: documentWidth,
                    height: document.documentElement.scrollHeight,
                    horizontalOverflow: Math.max(0, documentWidth - innerWidth),
                  },
                  displayFont: getComputedStyle(document.querySelector('.hero h1')).fontFamily,
                  missingSelectors: targets.filter((selector) => !document.querySelector(selector)),
                  rects,
                };
              }, selectors);

              if (metrics.theme !== 'editorial-production') {
                browserErrors.push(`Unexpected theme: ${metrics.theme}`);
              }
              if (metrics.missingSelectors.length) {
                browserErrors.push(`Missing selectors: ${metrics.missingSelectors.join(', ')}`);
              }
              if (metrics.document.horizontalOverflow > 1) {
                browserErrors.push(`Horizontal overflow: ${metrics.document.horizontalOverflow}px`);
              }

              await page.screenshot({ path: `visual/actual/${name}.png`, fullPage: true });
              await writeFile(`visual/actual/${name}-metrics.json`, JSON.stringify(metrics, null, 2));
              summaries.push({ name, ...metrics, browserErrors });

              console.log(`${name}: ${metrics.document.width}x${metrics.document.height}; overflow=${metrics.document.horizontalOverflow}px; theme=${metrics.theme}`);
              if (browserErrors.length) {
                throw new Error(`${name} visual QA failed: ${browserErrors.join(' | ')}`);
              }

              await page.close();
            }
          } finally {
            await writeFile('visual/actual/summary.json', JSON.stringify(summaries, null, 2));
            await browser.close();
          }
          EOF
          node visual/runtime/capture.mjs

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-homepage-visual-qa
          path: visual/actual
          retention-days: 14

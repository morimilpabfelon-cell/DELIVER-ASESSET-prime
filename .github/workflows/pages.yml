name: Validate static site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site
        run: node scripts/verify-site.mjs

      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: deliver-prime-static-${{ github.sha }}
          path: |
            index.html
            *.css
            *.js
            assets
            .nojekyll
          if-no-files-found: error
          retention-days: 7

name: Rebuild Figma DAY asset

on:
  push:
    branches:
      - assets/figma-day-render
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/figma-day-render
          fetch-depth: 0

      - name: Reconstruct JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat assets/figma-day-import/hero-part-{01..05}.txt | tr -d '\n\r ' | base64 --decode > assets/figma-day-import/day-hero-render.jpg
          test "$(stat -c%s assets/figma-day-import/day-hero-render.jpg)" -eq 29111
          file assets/figma-day-import/day-hero-render.jpg | grep -q 'JPEG image data'

      - name: Commit reconstructed asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/figma-day-import/day-hero-render.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'assets: reconstruct Figma DAY hero JPEG'
          git push origin HEAD:assets/figma-day-render

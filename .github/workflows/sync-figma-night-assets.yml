name: Sync Figma night assets

on:
  push:
    branches: [feat/figma-night-rebuild]
    paths:
      - .github/workflows/sync-figma-night-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figma-night-rebuild

      - name: Download original Figma assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/figma-night
          fetch() { curl -L --fail --retry 3 --silent --show-error "$1" -o "assets/figma-night/$2"; }

          fetch 'https://www.figma.com/api/mcp/asset/01107431-a96f-4272-9c65-b7d61b9bd3e1' hero-desktop.png
          fetch 'https://www.figma.com/api/mcp/asset/45cc3cd5-6603-424a-a62f-3009200eb39d' hero-tablet.png
          fetch 'https://www.figma.com/api/mcp/asset/dfbe1864-46b6-4ea7-ae04-2e364dde95d4' hero-mobile.png

          fetch 'https://www.figma.com/api/mcp/asset/00d9238a-14f6-455a-a405-e4226eead913' manifesto-desktop.png
          fetch 'https://www.figma.com/api/mcp/asset/4096668a-c9bc-42f7-b18f-3178a6a9ac17' manifesto-mobile.png

          fetch 'https://www.figma.com/api/mcp/asset/5a3b1202-e4ad-4256-902d-6b815193d893' map-desktop.png
          fetch 'https://www.figma.com/api/mcp/asset/a914d07f-f04f-45f1-a94b-3892924c7d2e' map-tablet.png
          fetch 'https://www.figma.com/api/mcp/asset/0586f4ff-1440-4617-bf46-b5e581bffa47' map-mobile.png

          fetch 'https://www.figma.com/api/mcp/asset/4e14fb97-3ebe-4568-8323-e333fe3c5d1c' process-pide-desktop.png
          fetch 'https://www.figma.com/api/mcp/asset/2b2a4bd0-462e-475c-854e-d6c15b2a4859' process-mira-desktop.png
          fetch 'https://www.figma.com/api/mcp/asset/0e40b1c6-f1a7-4261-a58b-d2803686b56d' process-recibe-desktop.png
          fetch 'https://www.figma.com/api/mcp/asset/5f218b8f-51f1-4c07-a4b5-7771de5440bc' process-pide-tablet.png
          fetch 'https://www.figma.com/api/mcp/asset/2c84f0ef-affc-4816-b0cd-808d7c097f1a' process-mira-tablet.png
          fetch 'https://www.figma.com/api/mcp/asset/bd62d870-887b-4c63-a982-9d0275ef9976' process-recibe-tablet.png
          fetch 'https://www.figma.com/api/mcp/asset/36b61adc-adc8-4352-8894-fcda557fde7e' process-pide-mobile.png
          fetch 'https://www.figma.com/api/mcp/asset/6cab4465-cf26-429f-9e4f-647ae6ae6c2c' process-mira-mobile.png
          fetch 'https://www.figma.com/api/mcp/asset/1eb36567-1591-49bd-b6ec-3ac34c93678e' process-recibe-mobile.png

          fetch 'https://www.figma.com/api/mcp/asset/19ae3f61-30f1-44b9-8fe5-804d9a457689' business-desktop.png
          fetch 'https://www.figma.com/api/mcp/asset/19df50cf-69f9-40b4-832c-1a6467aefb17' rider-desktop.png
          fetch 'https://www.figma.com/api/mcp/asset/53dff144-dac6-4edd-be52-1d32f30ec2d7' business-tablet.png
          fetch 'https://www.figma.com/api/mcp/asset/49a22170-8ab4-4c07-8495-15806454ab82' rider-tablet.png
          fetch 'https://www.figma.com/api/mcp/asset/2c1fb43b-1782-41bd-89a8-30f53ac50f30' business-mobile.png
          fetch 'https://www.figma.com/api/mcp/asset/fd006ecd-d9d0-4c38-8fdf-e623863d0656' rider-mobile.png

          for file in assets/figma-night/*.png; do
            test -s "$file"
            file "$file" | grep -Eq 'PNG|JPEG|Web/P image'
          done

      - name: Commit downloaded assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/figma-night
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'assets: add original Figma night media [skip ci]'
          git push origin HEAD:feat/figma-night-rebuild
